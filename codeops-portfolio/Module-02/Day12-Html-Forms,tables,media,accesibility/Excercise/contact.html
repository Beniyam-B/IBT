<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Habesha Eatery, Bole</title>
        <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa. Contact us for reservations, inquiries, or feedback.">
    </head>
    <body>
        <header><h1>Contact Habesha Eatery</h1></header>
        <nav><a href="index.html">Reservations</a> . <a href="contact.html">Contact</a></nav><br>
        <main>
            <form action="/contact" method="post">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required><br><br>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required><br><br>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>
                <button type="submit">Send Message</button>
            </form><br><br>
            <table>
                <caption><strong>Opening Hours</strong></caption>
                <thead>
                    <tr>
                        <th>Days</th>
                        <th>Hours</th>
                    </tr>
                </thead>
                <tbody>
                        <tr>
                            <th scope="row">Monday - Friday</th>
                            <td>8:30 AM - 10:00 PM</td>
                        </tr>
                        <tr>
                            <th scope="row">Saturday - Sunday</th>
                            <td>7:00 AM - 11:00 PM</td>
                        </tr>
                </tbody>
            </table><br><br>
        </main>
        <footer>Bole, Addis Ababa, Ethiopia | Phone: +251 9XXXXXXXX | Email:Habesha@eatery</footer>
    </body>
</html>
