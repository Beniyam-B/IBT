<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Addis Market Signup</title>
</head>
<body>
    <h1>Addis Market Signup</h1>

    <form id="signup">
        <label for="name">Full name</label>
        <input id="name" placeholder="e.g. Almaz Bekele" />

        <label for="phone">Phone number</label>
        <input id="phone" />

        <button type="submit">Sign up</button>
    </form>

    <p id="error"></p>
    <p id="count">0 people signed up</p>

    <script src="./app.js"></script>
</body>
</html>
