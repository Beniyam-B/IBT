<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<title>Addis Eats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Addis <span>Eats</span></h1>
    <input id="search" type="text" placeholder="Search dishes…" aria-label="Search dishes">
</header>

<main>
    <section id="menu" aria-label="Menu"></section>
    <aside id="cart" aria-label="Your order"></aside>
    <section id="checkout-section" aria-label="Checkout">
  <h2>Checkout</h2>
  <form id="checkout" novalidate>
    <label>Name
      <input id="name" required>
    </label>
    <label>Phone (TeleBirr)
      <input id="phone" placeholder="09xxxxxxxx">
    </label>
    <label>Delivery area
      <select id="area">
        <option>Bole</option>
        <option>Kazanchis</option>
        <option>Megenagna</option>
      </select>
    </label>
    <p id="form-error" class="error" aria-live="polite"></p>
    <button type="submit">Place order</button>
  </form>
  <p id="confirmation" class="confirmation" hidden></p>
</section>
</main>

<footer>
    <p>Bole, Addis Ababa · Ethiopia</p>
</footer>

<script src="app.js"></script>
</body>
</html>
